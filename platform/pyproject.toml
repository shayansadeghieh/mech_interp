[project]
name = "activation-monitor"
version = "0.1.0"
description = "Reproducible activation-based LLM monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "transformers>=4.57,<5",
    "psutil>=7,<8",
]

[project.scripts]
activation-monitor = "activation_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activation_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
